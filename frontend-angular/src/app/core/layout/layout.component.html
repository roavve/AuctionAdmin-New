<div class="root">
  <mat-toolbar color="primary" class="appbar">
    <span class="app-title">Auction Admin</span>
    <span class="spacer"></span>
    <span class="user-email">{{ auth.user()?.email }}</span>
    <button mat-icon-button (click)="logout()" title="Logout" aria-label="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <nav class="drawer">
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
