<div class="page">
  <div class="header">
    <h1 class="title">Categories</h1>
    <button mat-raised-button color="primary" (click)="openForm(null)">
      <mat-icon>add</mat-icon>
      New Category
    </button>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }
  @if (actionMsg()) {
    <div class="alert-info">
      <span>{{ actionMsg() }}</span>
      <button class="alert-close" (click)="actionMsg.set('')" aria-label="Close">&times;</button>
    </div>
  }

  <ag-grid-angular
    class="grid"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columnDefs"
    [domLayout]="'autoHeight'"
    [loading]="loading()"
    [suppressCellFocus]="true">
  </ag-grid-angular>

  <mat-paginator
    [length]="allRows().length"
    [pageIndex]="page()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[20, 50, 100]"
    (page)="onPage($event)">
  </mat-paginator>
</div>
