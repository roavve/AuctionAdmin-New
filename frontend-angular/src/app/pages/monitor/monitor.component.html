<div class="page">
  <h1 class="title">Auction Monitor</h1>

  <mat-tab-group
    class="tabs"
    [selectedIndex]="tab()"
    (selectedIndexChange)="onTab($event)">
    <mat-tab label="Active"></mat-tab>
    <mat-tab label="Planned"></mat-tab>
    <mat-tab label="Closed"></mat-tab>
    <mat-tab label="Cancelled"></mat-tab>
  </mat-tab-group>

  <ag-grid-angular
    class="grid"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columnDefs"
    [domLayout]="'autoHeight'"
    [loading]="loading()"
    [suppressCellFocus]="true">
  </ag-grid-angular>

  <mat-paginator
    [length]="total()"
    [pageIndex]="page()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    (page)="onPage($event)">
  </mat-paginator>
</div>
