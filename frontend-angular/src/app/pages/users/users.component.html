<div class="page">
  <div class="header">
    <h1 class="title">Users</h1>
    <div class="header-actions">
      <button
        mat-stroked-button
        [color]="activeFilterCount() > 0 ? 'primary' : ''"
        (click)="showFilters.set(!showFilters())">
        <mat-icon>filter_list</mat-icon>
        Filters{{ activeFilterCount() > 0 ? ' (' + activeFilterCount() + ')' : '' }}
      </button>
      <button mat-raised-button color="primary" (click)="router.navigate(['/users/new'])">
        <mat-icon>add</mat-icon>
        New User
      </button>
    </div>
  </div>

  <div class="filters" [class.open]="showFilters()">
    <div class="filters-paper">
      <div class="filters-grid">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="filters.email" (keydown.enter)="handleSearch()" />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field sm">
          <mat-label>Type</mat-label>
          <mat-select [(ngModel)]="filters.internal">
            <mat-option value="">All</mat-option>
            <mat-option value="true">Internal</mat-option>
            <mat-option value="false">External</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field sm">
          <mat-label>Active</mat-label>
          <mat-select [(ngModel)]="filters.active">
            <mat-option value="">All</mat-option>
            <mat-option value="true">Active</mat-option>
            <mat-option value="false">Inactive</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field sm">
          <mat-label>Locked</mat-label>
          <mat-select [(ngModel)]="filters.locked">
            <mat-option value="">All</mat-option>
            <mat-option value="true">Locked</mat-option>
            <mat-option value="false">Not Locked</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="search-actions">
          <button mat-raised-button color="primary" (click)="handleSearch()">
            <mat-icon>search</mat-icon>
            Search
          </button>
          <button mat-icon-button (click)="handleClear()" title="Clear">
            <mat-icon>clear</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  @if (error()) {
  <div class="alert-error">{{ error() }}</div>
  }

  <ag-grid-angular
    class="grid"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columnDefs"
    [domLayout]="'autoHeight'"
    [loading]="loading()"
    [suppressCellFocus]="true">
  </ag-grid-angular>

  <mat-paginator
    [length]="total()"
    [pageIndex]="page()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    (page)="onPage($event)">
  </mat-paginator>
</div>
